version: '3'
info:
  companyName: agentor
  productName: agentor
  productIdentifier: io.agentor.desktop
  description: Codex 对话与工作编排
  version: '0.1.1'
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir: [.git, .tools, .task, node_modules, frontend, bin]
    file: [.DS_Store, '*_test.go']
    watched_extension: ['*.go']
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown
