version: '3'

vars:
  APP_NAME: agentor
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9256}}'

includes:
  common: ./build/Taskfile.yml

tasks:
  dev:
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
  build:
    cmds:
      - task: common:generate:bindings
      - task: common:build:frontend
      - cmd: wails3 generate syso -arch {{ARCH}} -icon "build/windows/icon.ico" -manifest "build/windows/agentor.exe.manifest" -out "rsrc_windows_{{ARCH}}.syso"
        platforms: [windows]
      - go build -buildvcs=false -o "{{.BIN_DIR}}/{{.APP_NAME}}{{if eq OS "windows"}}.exe{{end}}" .
      - make package_{{OS}}
  run:
    cmds:
      - task: common:run:{{OS}}
