version: '3'

vars:
  APP_NAME: agentor
  BIN_DIR: bin
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9256}}'

includes:
  common: ./build/Taskfile.yml

tasks:
  dev:
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
  build:
    cmds:
      - task: common:generate:bindings
      - task: common:build:frontend
      - go build -buildvcs=false -o "{{.BIN_DIR}}/{{.APP_NAME}}{{if eq OS "windows"}}.exe{{end}}" .
  run:
    cmds:
      - task: common:run:{{OS}}
